# Optional containers for OmniOSINT's services (Docker Desktop on Windows, or
# Docker on Linux). OmniOSINT itself runs on the host; only PostgreSQL (and,
# if you want it, Redis) run here. Both listen on this computer only.
#
# setup.ps1 / install.sh can start this for you. By hand:
#
#   1. Put a password in .env.docker (not committed):
#        OMNIOSINT_DB_PASSWORD=<a long random value>
#   2. docker compose --env-file .env.docker up -d postgres
#   3. omniosint config set database.port 5433
#      omniosint secrets set database.password      (the same value)
#   4. omniosint db upgrade
#
# Data is kept in the named volume "omniosint-postgres" and survives
# `docker compose down`. `docker compose down -v` deletes it.
name: omniosint

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: omniosint
      POSTGRES_DB: omniosint
      POSTGRES_PASSWORD: ${OMNIOSINT_DB_PASSWORD:?Set OMNIOSINT_DB_PASSWORD in .env.docker}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${OMNIOSINT_DB_PORT:-5433}:5432"
    volumes:
      - omniosint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniosint -d omniosint"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${OMNIOSINT_REDIS_PORT:-6380}:6379"
    restart: unless-stopped

volumes:
  omniosint-postgres:
