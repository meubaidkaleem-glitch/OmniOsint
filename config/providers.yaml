# OmniOSINT provider catalogue
#
# This is the inventory of data sources and tools the platform is designed to
# integrate. It is metadata, not configuration: it holds no credentials and
# enables nothing by itself.
#
# status
#   planned      no adapter exists yet (shown in the interface as
#                "Planned - integration not yet implemented")
#   available    an adapter exists and is tested
#   excluded     will not be integrated; the note says why
#
# access (how the source can be used, to the best of current knowledge)
#   free           no account or key needed
#   free_key       free, but an account or key is required
#   freemium       a limited free tier exists; fuller use is paid
#   paid           a paid plan or credits are required
#   self_hosted    connects to an instance the user operates or may use
#   local_library  runs inside OmniOSINT, no network service
#   local_tool     separate program the user installs; never bundled
#   none           no official programmatic access
#
# IMPORTANT: access notes describe publicly documented terms as understood when
# this file was written. Terms, quotas and endpoints change. Each entry is
# re-verified against the provider's official documentation when its adapter is
# built, and the adapter discovers plan and quota at runtime where the provider
# exposes them. Nothing here is a promise of what a given account can do.

version: 1

providers:
  # ---------------------------------------------------------------- internet assets
  - id: shodan
    name: Shodan
    category: internet_assets
    access: freemium
    auth: api_key
    docs_url: https://developer.shodan.io/api
    phase: 5
    status: planned
    modules: [ip, internet_assets, network_topology]
    notes: >-
      Free accounts have little or no search quota; search filters and bulk
      access need a paid plan. Plan and remaining credits are read from the
      account information endpoint.

  - id: shodan_internetdb
    name: Shodan InternetDB
    category: internet_assets
    access: free
    auth: none
    docs_url: https://internetdb.shodan.io/
    phase: 5
    status: planned
    modules: [ip, internet_assets]
    upstream: [shodan]
    notes: >-
      Keyless per-IP summary (ports, hostnames, product identifiers,
      vulnerability identifiers). Intended for non-commercial use. Preferred
      free-first source before spending Shodan credits.

  - id: censys
    name: Censys
    category: internet_assets
    access: freemium
    auth: token
    docs_url: https://docs.censys.com/
    phase: 5
    status: planned
    modules: [ip, domain, internet_assets, network_topology]
    notes: >-
      Two API generations exist (legacy Search and the Censys Platform) with
      different authentication. The adapter must detect which one the account
      can use instead of assuming either.

  - id: fofa
    name: FOFA
    category: internet_assets
    access: paid
    auth: api_key
    docs_url: https://en.fofa.info/api
    phase: 5
    status: planned
    modules: [ip, domain, internet_assets]
    notes: >-
      Result fields and volumes depend on membership level and points. Free
      accounts have very limited API access.

  - id: zoomeye
    name: ZoomEye
    category: internet_assets
    access: freemium
    auth: api_key
    docs_url: https://www.zoomeye.ai/
    phase: 5
    status: planned
    modules: [ip, domain, internet_assets]
    notes: Credit-based quota. API host and version have changed over time.

  - id: netlas
    name: Netlas
