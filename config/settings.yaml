# OmniOSINT default settings.
#
# Do not edit this file to configure an installation: it is replaced on update.
# Put your changes in the user settings file instead (same structure, only the
# keys you want to change):
#
#   Windows   %LOCALAPPDATA%\OmniOSINT\config\settings.yaml
#   Linux     ~/.local/share/OmniOSINT/config/settings.yaml
#
# Any setting can also be given as an environment variable, for example
#   OMNIOSINT_SERVER__PORT=9000
#
# Secrets (database password, Redis URL with a password) are never read from
# YAML. Use environment variables or:  omniosint secrets set database.password
#
# Run `omniosint config show` to see the effective configuration and
# `omniosint config paths` to see which files were read.

# production | development | test
environment: production

server:
  # The interface is local-only. A non-loopback address is refused unless
  # allow_non_loopback is true.
  host: 127.0.0.1
  port: 8765
  allow_non_loopback: false
  # Host names accepted in the HTTP Host header (defence against DNS rebinding).
  allowed_hosts: ["127.0.0.1", "localhost", "::1"]
  # Extra browser origins allowed to call the API. Empty in production: the web
  # interface is served from the same origin.
  cors_origins: []
  serve_frontend: true
  max_request_body_bytes: 1048576

database:
  host: 127.0.0.1
  port: 5432
  name: omniosint
  user: omniosint
  # disable | allow | prefer | require | verify-ca | verify-full
  ssl_mode: prefer
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 10
  connect_timeout_seconds: 5
  statement_timeout_ms: 30000

# Redis is optional. Leave the URL unset to use in-process fallbacks.
# Set it with OMNIOSINT_REDIS__URL=redis://127.0.0.1:6379/0
redis:
  socket_timeout_seconds: 2

auth:
  session_cookie_name: omniosint_session
  session_ttl_hours: 12
  session_idle_minutes: 120
  # Set to true only when the interface is served over HTTPS by a reverse proxy.
  cookie_secure: false
  password_min_length: 12
  max_failed_logins: 5
  lockout_minutes: 15
  login_rate_limit_per_minute: 10
  argon2_time_cost: 3
  argon2_memory_kib: 65536
  argon2_parallelism: 4

worker:
  heartbeat_seconds: 15
  housekeeping_interval_seconds: 300
  # Expired and revoked sessions are deleted this many days after they end.
  session_retention_days: 7

runtime:
  startup_timeout_seconds: 60
  shutdown_timeout_seconds: 30

collection:
  # Generates labelled test data through the real pipeline. For testing only:
  # everything it produces is marked simulated and is never a real result.
  enable_simulated_provider: false
  # Region (ISO 3166, e.g. GB) assumed for phone numbers without a country code.
  default_phone_region: null
  # Raw provider responses are deleted this many days after collection; the
  # evidence keeps their hashes.
  raw_retention_days: 90
  max_concurrent_jobs: 4
  job_lease_seconds: 120
  max_attempts: 3
  retry_base_seconds: 5
  retry_max_seconds: 300
  # Paid calls estimated above this many credits wait for approval (0: every paid call).
  approval_credit_threshold: 0
  rate_limit_max_wait_seconds: 30
  http_timeout_seconds: 30
  http_max_response_bytes: 10485760
  poll_interval_seconds: 1
