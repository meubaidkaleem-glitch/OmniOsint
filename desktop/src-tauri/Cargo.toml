[package]
name = "omniosint-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "OmniOSINT desktop shell: starts, monitors and stops the local backend and shows its interface."
publish = false

[lib]
name = "omniosint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
omniosint-backend-control = { path = "../backend-control" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-notification = "=2.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
